demonstration:
  exp: demonstration
  run: freeform
tick_interval: 0.1
participants:
  - name: xbox
    binding: xbox
    emits: al5d_target
    target_robot: al5d
  - name: al5d
    binding: al5d
    command: al5d_target
  - name: widowx
    binding: widowx_observer
  - name: cameras
    binding: fixed_cameras
