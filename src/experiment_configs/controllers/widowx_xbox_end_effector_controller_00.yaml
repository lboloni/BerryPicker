# XBox control of a WidowX Cartesian end-effector pose (meters and radians).
# Left stick: x/y; right stick: z/yaw; LT-RT: roll; vertical D-pad: pitch.
# Controller button names can vary; these names match the existing Voyee setup.
button_exit: square
button_home: home
button_release: l1
button_grasp: r1

max_input_dt: 0.25
gripper_pressure: 0.5

velocity:
  x: 0.10
  y: 0.10
  z: 0.08
  roll: 0.50
  pitch: 0.50
  yaw: 0.50
