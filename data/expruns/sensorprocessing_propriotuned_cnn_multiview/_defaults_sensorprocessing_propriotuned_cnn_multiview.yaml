# Multi-view propriotuned CNN (VGG19 / ResNet50 backbones with fusion heads).
# See sensorprocessing/sp_propriotuned_cnn_multiview.py
class: "MultiViewCNNSensorProcessing"
model: "MultiViewVGG19Model"
model_name: "cnn_multiview"

latent_size: 128
image_size: [256, 256]
num_views: 2
cameras: ["dev2", "dev3"]
fusion_type: "concat_proj"
shared_backbone: true
batched_backbone: true
freeze_feature_extractor: true

# per-view projector: backbone features -> hidden -> d_view (fusion input width)
view_projection_hidden_dim: 512
view_projection_dim: 256

output_size: 6
proprio_step_1: 128
proprio_step_2: 64

loss: "MSELoss"
learning_rate: 0.001
weight_decay: 0.0001
batch_size: 32
epochs: 300
early_stopping_patience: 50
grad_clip_norm: 1.0

proprioception_mlp_model_file: "proprioception_mlp.pth"
proprioception_input_file: "train_inputs.pt"
proprioception_target_file: "train_targets.pt"
proprioception_test_input_file: "test_inputs.pt"
proprioception_test_target_file: "test_targets.pt"

robot_exp: "robot_al5d"
robot_run: "position_controller_00"

# Entries are demonstration run, demonstration name, and ordered camera views.
training_data:
  - ["random-both-cameras-video", "2025_03_08__14_15_53", ["dev2", "dev3"]]
validation_data:
  - ["random-both-cameras-video", "2025_03_08__14_23_19", ["dev2", "dev3"]]
  - ["random-both-cameras-video", "2025_03_08__14_24_52", ["dev2", "dev3"]]
