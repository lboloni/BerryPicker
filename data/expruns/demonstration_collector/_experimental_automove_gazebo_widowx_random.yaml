# Random movement of the WidowX 250s in Gazebo, recorded with the Gazebo camera
# (experiment src/_experimental/_2026_11_widowx_random_movement).
demonstration:
  exp: demonstration
  run: _experimental_widowx_random_gazebo
tick_interval: 0.1
participants:
  - name: automove
    binding: widowx_automove
    exp: automove
    run: _experimental_widowx_random_00
    emits: widowx_target
    target_robot: widowx
  - name: widowx
    binding: gazebo_widowx
    command: widowx_target
    blocking: false
  - name: gazebo_cameras
    binding: gazebo_cameras
