# Native task-space controller for a WidowX 250s. Distances are meters and angles radians.
robot_name: widowx
controller_type: position_controller

robot_model: wx250s
interbotix_robot_name: wx250s
group_name: arm
gripper_name: gripper
moving_time: 0.1
accel_time: 0.05
gripper_pressure: 0.5
gripper_delay: 0.0

# "ready": from the sleep pose, torque on, joint-space move to READY_JOINTS (= POSE_DEFAULT).
# "sleep": through READY_JOINTS to the sleep pose, then torque off.
# See src/robot/widowx/DESIGN-WIDOWX.md, section 6.
startup_pose: ready
shutdown_pose: sleep
READY_JOINTS: [0.0, -0.40, 1.09, 0.0, -0.70, 0.0]
transition_time: 3.0
settle_tolerance: 0.05
settle_timeout: 2.0

POSE_DEFAULT:
  x: 0.30
  y: 0.00
  z: 0.20
  roll: 0.0
  pitch: 0.0
  yaw: 0.0

# Representable pose envelope. AutoMove has a smaller, setup-specific sampling workspace.
POSE_MIN:
  x: -0.60
  y: -0.60
  z: -0.20
  roll: -3.141592654
  pitch: -3.141592654
  yaw: -3.141592654

POSE_MAX:
  x: 0.60
  y: 0.60
  z: 0.80
  roll: 3.141592654
  pitch: 3.141592654
  yaw: 3.141592654
