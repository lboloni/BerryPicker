# Random movement of the WidowX 250s for the experiment
# src/_experimental/_2026_11_widowx_random_movement (plan: PLAN-WidowXRandomMovement).
# The workspace of automove_widowx_random_pose_00 (meters and radians); one seed per
# episode through the automove_random_seed runtime override.
# The arm starts and ends at the ready pose (src/robot/widowx/DESIGN-WIDOWX.md, section 6).
automove_type: random_widowx_pose
random_seed: 73017
waypoint_count: 10
max_timesteps: 1000
max_sampling_attempts: 10000
interactive_confirm: false
controller_interval: 0.1
robot_interval: 0.1
waypoint_reached_distance: 0.001

pose:
  x: {random: [0.22, 0.38]}
  y: {random: [-0.15, 0.15]}
  z: {random: [0.12, 0.32]}
  roll: {fixed: 0.0}
  pitch: {random: [-0.60, 0.20]}
  # the gripper points away from the base; the offset must stay 0 (DESIGN-WIDOWX.md, section 9)
  yaw: {heading: [0.0, 0.0]}

# The action is issued once, after the corresponding pose has been reached.
gripper_actions: [hold, grasp, release]
gripper_pressure: 0.5

motion:
  type: widowx_pose_velocity
  velocity:
    x: 0.08
    y: 0.08
    z: 0.08
    roll: 0.50
    pitch: 0.50
    yaw: 0.50
