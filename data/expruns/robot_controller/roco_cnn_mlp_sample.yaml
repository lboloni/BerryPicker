name: "ResNet-50 CNN encoder + deterministic MLP controller"
class: GraphRobotController

components:
  image_input:
    run: rcco_input_default
  cnn_encoder:
    run: rcco_sp_cnn_resnet50_256
  mlp:
    run: rcco_mlp_256_6
  robot_output:
    run: rcco_robot_action_output_6

connections:
  - from_component: image_input
    from_output: input
    to_component: cnn_encoder
    to_input: image
  - from_component: cnn_encoder
    from_output: z
    to_component: mlp
    to_input: z
  - from_component: mlp
    from_output: a
    to_component: robot_output
    to_input: output
