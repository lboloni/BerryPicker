# Multi-view propriotuned ViT (shared ViT backbone with fusion heads).
# See sensorprocessing/sp_vit_multiview.py
class: "Vit_multiview"
model_name: "vit_multiview"

vit_model: "vit_b_16"
vit_weights: "DEFAULT"
latent_size: 128
image_size: [224, 224]
num_views: 2
cameras: ["dev2", "dev3"]
fusion_type: "concat_proj"
shared_backbone: true
batched_backbone: true
freeze_feature_extractor: false

# fusion head options (see sensorprocessing/multiview_fusion.py); leave
# fusion_hidden_dim unset to derive the widths from the backbone width
fusion_dropout: 0.1
attention_residual: true
view_embedding: true

output_size: 6
proprio_step_1: 64
proprio_step_2: 64

loss: "MSELoss"
learning_rate: 0.0001
weight_decay: 0.01
batch_size: 32
epochs: 300
early_stopping_patience: 50
grad_clip_norm: 1.0

proprioception_mlp_model_file: "proprioception_mlp.pth"
proprioception_input_file: "train_inputs.pt"
proprioception_target_file: "train_targets.pt"
proprioception_test_input_file: "test_inputs.pt"
proprioception_test_target_file: "test_targets.pt"

robot_exp: "robot_al5d"
robot_run: "position_controller_00"

# Entries are demonstration run, demonstration name, and ordered camera views.
training_data:
  - ["random-both-cameras-video", "2025_03_08__14_15_53", ["dev2", "dev3"]]
validation_data:
  - ["random-both-cameras-video", "2025_03_08__14_23_19", ["dev2", "dev3"]]
  - ["random-both-cameras-video", "2025_03_08__14_24_52", ["dev2", "dev3"]]
