  "panda_joint2": -1.05
  "panda_joint3": -1.15
  "panda_joint4": -2.9
  "panda_joint5": -1.05
  "panda_joint6": 1.6

POS_MAX:
  "panda_joint1": 1.15
  "panda_joint2": 0.25
  "panda_joint3": 0.6
  "panda_joint4": -1.7
  "panda_joint5": 0.65
