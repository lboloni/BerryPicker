input-to-notebook:
  - visual_proprioception/Tune_PositionFilter.ipynb
  - visual_proprioception/Verify_VisualProprioception.ipynb
  - visual_proprioception/Compare_VisualProprioception.ipynb

# Constant-velocity Kalman filtering over the output of the vp_ptun_vgg19_128
# regressor. This run trains nothing: it reuses that run's trained regressor
# and its cached latents, so any difference in error is due to the filter alone.
name: "ptun-vgg19-128-kalman"

base_experiment: visual_proprioception
base_run: vp_ptun_vgg19_128

position_filter: kalman

# Six independent [position, velocity] filters. Both vectors are in
# RobotPosition.FIELDS order:
# height, distance, heading, wrist_angle, wrist_rotation, gripper.

# Acceleration noise density, derived from the velocity changes of the
# commanded trajectory in the TRAINING demonstration only.
filter_process_noise: [0.02189, 0.00885, 0.00357, 0.01451, 0.00260, 0.11240]

# Variance of the regressor's error, from the per-field RMSE recorded in
# DESIGN-TemporalVisualProprioception.md. Refine both with
# Tune_PositionFilter.ipynb.
filter_measurement_noise: [0.03386, 0.01232, 0.00449, 0.02657, 0.02220, 0.10240]
